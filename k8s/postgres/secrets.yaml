# Usuário e senha do banco no Kubernetes (Minikube).
# ATENÇÃO: base64 NÃO é criptografia. Aqui é só a credencial de desenvolvimento "store"/"store",
# a mesma do padrão do api/compose.yaml. Segredos reais (JWT_SECRET_KEY, ACCOUNT_ADMIN_HASH)
# NÃO entram aqui: ficam em Secrets criados por "kubectl create secret", fora do Git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
data:
  POSTGRES_USER: c3RvcmU=       # "store"
  POSTGRES_PASSWORD: c3RvcmU=   # "store"
